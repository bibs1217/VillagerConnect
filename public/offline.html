<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VillagerConnect - Offline</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #FFFFFF;
      color: #1A1A1A;
      text-align: center;
      padding: 2rem 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .icon { font-size: 4rem; margin-bottom: 1.5rem; }
    h1 { color: #2D7A2D; font-size: 2rem; font-weight: 900; margin-bottom: 0.5rem; }
    .subtitle { color: #888; font-size: 0.9rem; margin-bottom: 0.25rem; }
    .message {
      color: #555;
      font-size: 1rem;
      max-width: 400px;
      line-height: 1.6;
      margin: 1.5rem auto;
      padding: 1.25rem 1.5rem;
      background: #F5F5F5;
      border-radius: 1rem;
      border: 1px solid #E0E0E0;
    }
    .links-title {
      color: #2D7A2D;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 1rem;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
      width: 100%;
      max-width: 320px;
    }
    .links a {
      color: #2D7A2D;
      display: block;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      padding: 0.75rem 1.25rem;
      background: rgba(45,122,45,0.06);
      border: 1px solid rgba(45,122,45,0.2);
      border-radius: 0.75rem;
    }
    .links a:hover { background: rgba(45,122,45,0.12); }
    .gold-bar {
      width: 80px;
      height: 4px;
      background: #FFD700;
      border-radius: 2px;
      margin: 1rem auto;
    }
    .retry {
      margin-top: 2rem;
      background: #2D7A2D;
      color: white;
      border: none;
      border-radius: 0.875rem;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      font-family: Georgia, serif;
    }
  </style>
</head>
<body>
  <div class="icon">🏌️</div>
  <h1>VillagerConnect</h1>
  <div class="subtitle">The Villages, FL</div>
  <div class="gold-bar"></div>
  <div class="message">
    You're currently offline. Check your connection and try again, or browse pages you've already visited below.
  </div>
  <div class="links-title">Cached Pages</div>
  <div class="links">
    <a href="/">🏠 Home</a>
    <a href="/entertainment">🎵 Entertainment</a>
    <a href="/news">📰 News</a>
    <a href="/landings">🏪 Landings & Dining</a>
    <a href="/golf-courses">⛳ Golf Courses</a>
    <a href="/events">📅 Events</a>
    <a href="/golf-cart-search">🛒 Buy/Sell Golf Carts</a>
    <a href="/cart-mechanic">🔧 AI Cart Mechanic</a>
  </div>
  <button class="retry" onclick="window.location.reload()">Try Again</button>
</body>
</html>
